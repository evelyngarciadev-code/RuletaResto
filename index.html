<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruleta de Premios - Howard Johnson Villa Carlos Paz</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1b365d 0%, #0b182e 100%);
      color: #ffffff;
      overflow-x: hidden;
      padding: 20px;
    }

    .contenedor-juego {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      width: 100%;
      max-width: 500px;
      /* Espacio superior para que Howie asomado arriba no se corte */
      margin-top: 115px;
    }

    .ruleta-wrapper {
      position: relative;
      width: 340px;
      height: 340px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Cuerpo de Howie asomado desde atrás arriba */
    .howie-cuerpo {
      position: absolute;
      top: -125px;
      left: 50%;
      transform: translateX(-50%);
      width: 190px;
      height: auto;
      z-index: 1; /* Detrás de la ruleta */
      pointer-events: none;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.45));
    }

    /* Canvas de la ruleta */
    canvas#ruleta {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 0 0 8px #f58220, 0 0 30px rgba(0, 0, 0, 0.7);
      position: relative;
      z-index: 2; /* Tapa la parte baja de Howie */
    }

    /* Ala de Howie por delante funcionando como puntero superior */
    .howie-ala {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      width: 68px;
      height: auto;
      z-index: 3; /* Por delante del borde superior de la ruleta */
      pointer-events: none;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.5));
      transition: transform 0.08s ease;
    }

    /* Efecto de rebote del ala cuando pasan los gajos */
    .howie-ala.tick {
      transform: translateX(-50%) rotate(-14deg);
    }

    /* Botón central para girar */
    .btn-girar {
      position: absolute;
      z-index: 4;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 4px solid #ffffff;
      background: linear-gradient(145deg, #f58220, #d96608);
      color: #ffffff;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      text-transform: uppercase;
    }

    .btn-girar:hover:not(:disabled) {
      transform: scale(1.07);
      box-shadow: 0 8px 20px rgba(245, 130, 32, 0.6);
    }

    .btn-girar:disabled {
      opacity: 0.75;
      cursor: not-allowed;
    }

    /* Popup Modal de Premio Ganado */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(7, 15, 30, 0.82);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-overlay.activo {
      display: flex;
      animation: fadeIn 0.25s ease forwards;
    }

    .modal-card {
      background: linear-gradient(160deg, #ffffff 0%, #f2f5fa 100%);
      color: #1b365d;
      width: 100%;
      max-width: 360px;
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
      border: 4px solid #f58220;
      transform: scale(0.9);
      animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .modal-titulo {
      font-size: 22px;
      font-weight: 800;
      color: #f58220;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .modal-premio {
      font-size: 26px;
      font-weight: 800;
      color: #1b365d;
      background: #e6eef8;
      padding: 16px 12px;
      border-radius: 12px;
      margin-bottom: 24px;
      border: 2px dashed #1b365d;
    }

    .btn-reiniciar {
      background: #1b365d;
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: background 0.2s ease, transform 0.15s ease;
      width: 100%;
    }

    .btn-reiniciar:hover {
      background: #f58220;
      transform: translateY(-2px);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes popUp {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @media (max-width: 400px) {
      .ruleta-wrapper {
        width: 295px;
        height: 295px;
      }
      .howie-cuerpo {
        width: 165px;
        top: -108px;
      }
      .howie-ala {
        width: 58px;
        top: -18px;
      }
    }
  </style>
</head>
<body>

  <div class="contenedor-juego">
    <div class="ruleta-wrapper">
      <!-- Cuerpo de Howie asomándose desde atrás arriba -->
      <img src="hc.png" alt="Howie" class="howie-cuerpo" id="howieCuerpo">

      <!-- Ruleta -->
      <canvas id="ruleta" width="500" height="500"></canvas>

      <!-- Ala de Howie arriba funcionando como puntero central -->
      <img src="ha.png" alt="Puntero Howie" class="howie-ala" id="howieAla">

      <!-- Botón Girar -->
      <button class="btn-girar" id="btnGirar">Girar</button>
    </div>
  </div>

  <!-- Tarjeta emergente de premio -->
  <div class="modal-overlay" id="modalPremio">
    <div class="modal-card">
      <div class="modal-titulo">¡Felicitaciones ganaste!</div>
      <div class="modal-premio" id="textoPremioGanado">Premio</div>
      <button class="btn-reiniciar" id="btnReiniciar">Volver a jugar</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('ruleta');
    const ctx = canvas.getContext('2d');
    const btnGirar = document.getElementById('btnGirar');
    const howieAla = document.getElementById('howieAla');
    const modalPremio = document.getElementById('modalPremio');
    const textoPremioGanado = document.getElementById('textoPremioGanado');
    const btnReiniciar = document.getElementById('btnReiniciar');

    // Configuración de los 8 gajos:
    // El "Premio dificil" tiene el color especial (dorado) y menor peso de probabilidad.
    // El "Premio facil" tiene el color base normal y mayor peso de probabilidad.
    const segmentos = [
      { label: 'Premio dificil', peso: 2,  color: '#f4b400', textoColor: '#1b365d', especial: true },
      { label: 'premio m1',      peso: 12, color: '#1b365d', textoColor: '#ffffff', especial: false },
      { label: 'premio m2',      peso: 12, color: '#2b548e', textoColor: '#ffffff', especial: false },
      { label: 'Premio facil',   peso: 26, color: '#1b365d', textoColor: '#ffffff', especial: false },
      { label: 'premio m3',      peso: 12, color: '#2b548e', textoColor: '#ffffff', especial: false },
      { label: 'premio m4',      peso: 12, color: '#1b365d', textoColor: '#ffffff', especial: false },
      { label: 'premio m5',      peso: 12, color: '#2b548e', textoColor: '#ffffff', especial: false },
      { label: 'premio m6',      peso: 12, color: '#1b365d', textoColor: '#ffffff', especial: false }
    ];

    const totalGajos = segmentos.length;
    const arcoGajo = (2 * Math.PI) / totalGajos;
    let anguloActual = 0; // En radianes
    let girando = false;

    // Dibujar la ruleta completa
    function dibujarRuleta() {
      const centroX = canvas.width / 2;
      const centroY = canvas.height / 2;
      const radio = canvas.width / 2;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < totalGajos; i++) {
        const anguloInicio = anguloActual + i * arcoGajo;
        const anguloFin = anguloInicio + arcoGajo;
        const seg = segmentos[i];

        // Gajo
        ctx.beginPath();
        ctx.moveTo(centroX, centroY);
        ctx.arc(centroX, centroY, radio, anguloInicio, anguloFin);
        ctx.closePath();

        if (seg.especial) {
          // Degradado dorado especial para el Premio difícil
          const grad = ctx.createRadialGradient(centroX, centroY, 30, centroX, centroY, radio);
          grad.addColorStop(0, '#ffe066');
          grad.addColorStop(0.6, '#f4b400');
          grad.addColorStop(1, '#d48806');
          ctx.fillStyle = grad;
        } else {
          ctx.fillStyle = seg.color;
        }
        ctx.fill();

        // Línea divisoria entre gajos
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        // Texto del premio
        ctx.save();
        ctx.translate(centroX, centroY);
        ctx.rotate(anguloInicio + arcoGajo / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = seg.textoColor;
        ctx.font = seg.especial ? '800 20px Montserrat, sans-serif' : '700 18px Montserrat, sans-serif';
        ctx.fillText(seg.label, radio - 28, 7);
        ctx.restore();
      }
    }

    // Selección ponderada según probabilidad
    function elegirIndiceGanador() {
      const sumaPesos = segmentos.reduce((acc, s) => acc + s.peso, 0);
      let random = Math.random() * sumaPesos;
      for (let i = 0; i < segmentos.length; i++) {
        if (random < segmentos[i].peso) return i;
        random -= segmentos[i].peso;
      }
      return 0;
    }

    // Animación de giro hacia el centro superior (3 * Math.PI / 2 = 270° = arriba)
    function girarRuleta() {
      if (girando) return;
      girando = true;
      btnGirar.disabled = true;

      const indiceGanador = elegirIndiceGanador();

      // El puntero está en el centro arriba: 270 grados = 1.5 * Math.PI radianes
      const anguloPunteroArriba = 1.5 * Math.PI;

      // Centro del gajo ganador cuando anguloActual = 0
      const centroGajo = indiceGanador * arcoGajo + arcoGajo / 2;

      // Rotación exacta necesaria para alinear el centro del gajo ganador con 1.5 * Math.PI
      let anguloDestino = (anguloPunteroArriba - centroGajo) % (2 * Math.PI);
      if (anguloDestino < 0) anguloDestino += 2 * Math.PI;

      // Diferencia desde la posición actual + 6 vueltas completas
      const vueltasExtra = 6 * 2 * Math.PI;
      const actualNormalizado = ((anguloActual % (2 * Math.PI)) + (2 * Math.PI)) % (2 * Math.PI);
      let delta = anguloDestino - actualNormalizado;
      if (delta <= 0) delta += 2 * Math.PI;

      const rotacionTotal = vueltasExtra + delta;
      const anguloInicial = anguloActual;
      const duracion = 4500; // 4.5 segundos de giro
      const inicioTiempo = performance.now();
      let ultimoGajoSonado = -1;

      function animar(ahora) {
        const transcurrido = ahora - inicioTiempo;
        const progreso = Math.min(transcurrido / duracion, 1);

        // Curva suave de desaceleración (easeOutQuart)
        const ease = 1 - Math.pow(1 - progreso, 4);
        anguloActual = anguloInicial + rotacionTotal * ease;

        dibujarRuleta();

        // Efecto visual en el ala cuando cruza cada divisor arriba
        const indiceBajoPuntero = Math.floor(
          (((anguloPunteroArriba - anguloActual) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI) / arcoGajo
        );
        if (indiceBajoPuntero !== ultimoGajoSonado) {
          ultimoGajoSonado = indiceBajoPuntero;
          howieAla.classList.add('tick');
          setTimeout(() => howieAla.classList.remove('tick'), 70);
        }

        if (progreso < 1) {
          requestAnimationFrame(animar);
        } else {
          anguloActual = anguloInicial + rotacionTotal;
          dibujarRuleta();

          // Pausa de 1 segundo mirando el premio ganador arriba antes de abrir el popup
          setTimeout(() => {
            textoPremioGanado.textContent = segmentos[indiceGanador].label;
            modalPremio.classList.add('activo');
            girando = false;
          }, 1000);
        }
      }

      requestAnimationFrame(animar);
    }

    // Reiniciar para volver a jugar
    function reiniciarRuleta() {
      modalPremio.classList.remove('activo');
      btnGirar.disabled = false;
    }

    btnGirar.addEventListener('click', girarRuleta);
    btnReiniciar.addEventListener('click', reiniciarRuleta);

    // Dibujo inicial
    dibujarRuleta();
  </script>
</body>
</html>
</html>
