<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruleta de Premios | Howard Johnson Plaza Villa Carlos Paz</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* =========================================================
         CONTROLES RÁPIDOS DE HOWIE (Modificá solo estos valores)
         ========================================================= */
      --ala-ancho: 300px;        /* Tamaño del ala */
      --ala-arriba: -100px;       /* Más negativo = sube / Menos negativo = baja */
      --ala-horizontal: -55%;    /* -50% es centro exacto (-45% derecha / -55% izquierda) */

      --howie-ancho: 310px;      /* Tamaño del cuerpo de Howie atrás */
      --howie-arriba: -38px;     /* Qué tanto se asoma detrás de la ruleta */

      /* Colores de marca */
      --navy-deep: #091326;
      --navy-mid: #122342;
      --navy-light: #1c3561;
      --gold-light: #f6e29c;
      --gold-mid: #ea8b38;
      --gold-dark: #997415;
      --cream: #faf8f5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 25%, rgba(212, 175, 55, 0.12) 0%, transparent 55%),
        radial-gradient(circle at center, #142749 0%, #070f1e 100%);
      color: var(--cream);
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
      padding: 24px 16px;
    }

    .header-marca {
      text-align: center;
      margin-bottom: 18px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .header-marca span {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: var(--gold-light);
      opacity: 0.85;
      margin-bottom: 4px;
    }

    .header-marca h1 {
      font-family: 'Cinzel', serif;
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 3px;
    }

    .escenario-ruleta {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 150px;
    }

    .ruleta-wrapper {
      position: relative;
      width: 360px;
      height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Cuerpo de Howie arriba detrás de la ruleta */
    .howie-contenedor {
      position: absolute;
      bottom: calc(100% + var(--howie-arriba));
      left: 50%;
      transform: translateX(-50%);
      width: var(--howie-ancho);
      z-index: 1;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .howie-cuerpo {
      position: relative;
      width: 100%;
      height: auto;
      z-index: 2;
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.55));
    }

    /* Bisel exterior metálico dorado de lujo */
    .bisel-exterior {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      padding: 12px;
      background: linear-gradient(135deg, #f6e29c 0%, #c59b27 35%, #7d5c0c 65%, #f3dc91 100%);
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.75),
        0 0 35px rgba(212, 175, 55, 0.2),
        inset 0 2px 4px rgba(255, 255, 255, 0.6);
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bisel-interior {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      padding: 4px;
      background: #081122;
      box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas#ruleta {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: block;
    }

    /* Ala de Howie controlada desde :root */
    .howie-ala {
      position: absolute;
      top: var(--ala-arriba);
      left: 50%;
      transform: translateX(var(--ala-horizontal));
      width: var(--ala-ancho);
      max-width: none;
      height: auto;
      z-index: 4;
      pointer-events: none;
      filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.65));
      transform-origin: top center;
      transition: transform 0.08s ease-out;
    }

    .howie-ala.tick {
      transform: translateX(var(--ala-horizontal)) rotate(-10deg);
    }

    .btn-girar {
      position: absolute;
      z-index: 5;
      width: 82px;
      height: 82px;
      border-radius: 50%;
      border: 2px solid var(--gold-light);
      background: radial-gradient(circle at 30% 30%, #244275 0%, #0b172e 85%);
      color: var(--gold-light);
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow:
        0 0 0 5px rgba(212, 175, 55, 0.25),
        0 8px 20px rgba(0, 0, 0, 0.7),
        inset 0 1px 3px rgba(255, 255, 255, 0.35);
      transition: all 0.25s ease;
      text-transform: uppercase;
    }

    .btn-girar:hover:not(:disabled) {
      transform: scale(1.06);
      color: #ffffff;
      border-color: #ffffff;
      box-shadow:
        0 0 0 6px rgba(212, 175, 55, 0.4),
        0 10px 25px rgba(212, 175, 55, 0.35);
    }

    .btn-girar:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 11, 24, 0.85);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-overlay.activo {
      display: flex;
      animation: fadeIn 0.3s ease forwards;
    }

    .modal-card {
      position: relative;
      background: linear-gradient(165deg, #132647 0%, #091326 100%);
      color: #ffffff;
      width: 100%;
      max-width: 370px;
      border-radius: 18px;
      padding: 36px 28px;
      text-align: center;
      border: 1.5px solid rgba(212, 175, 55, 0.65);
      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.8),
        0 0 30px rgba(212, 175, 55, 0.15);
      animation: popUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .modal-subtitulo {
      font-size: 11px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--gold-light);
      margin-bottom: 8px;
      opacity: 0.9;
    }

    .modal-titulo {
      font-family: 'Cinzel', serif;
      font-size: 23px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    .modal-premio {
      font-size: 22px;
      font-weight: 600;
      color: var(--gold-light);
      background: rgba(255, 255, 255, 0.04);
      padding: 18px 16px;
      border-radius: 12px;
      margin-bottom: 26px;
      border: 1px solid rgba(212, 175, 55, 0.4);
      letter-spacing: 0.5px;
    }

    .btn-reiniciar {
      background: linear-gradient(135deg, #e5c465 0%, #b88d21 100%);
      color: #091326;
      border: none;
      padding: 14px 28px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      transition: all 0.2s ease;
      width: 100%;
      box-shadow: 0 6px 18px rgba(212, 175, 55, 0.3);
    }

    .btn-reiniciar:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes popUp {
      from { transform: scale(0.92) translateY(10px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }

    @media (max-width: 420px) {
      .escenario-ruleta {
        padding-top: 125px;
      }
      .ruleta-wrapper {
        width: 305px;
        height: 305px;
      }
    }
  </style>
</head>
<body>

  <div class="header-marca">
    <span>Howard Johnson Plaza</span>
    <h1>Villa Carlos Paz</h1>
  </div>

  <div class="escenario-ruleta">
    <div class="ruleta-wrapper">
      <!-- Cuerpo de Howie -->
      <div class="howie-contenedor">
        <img src="hc.png" alt="Howie" class="howie-cuerpo" id="howieCuerpo">
      </div>

      <!-- Bisel dorado + Canvas de ruleta -->
      <div class="bisel-exterior">
        <div class="bisel-interior">
          <canvas id="ruleta" width="600" height="600"></canvas>
        </div>
      </div>

      <!-- Ala de Howie -->
      <img src="ha.png" alt="Puntero Howie" class="howie-ala" id="howieAla">

      <!-- Botón central -->
      <button class="btn-girar" id="btnGirar">Girar</button>
    </div>
  </div>

  <!-- Popup de premio ganado -->
  <div class="modal-overlay" id="modalPremio">
    <div class="modal-card">
      <div class="modal-subtitulo">Howard Johnson Plaza</div>
      <div class="modal-titulo">¡Felicitaciones ganaste!</div>
      <div class="modal-premio" id="textoPremioGanado">Premio</div>
      <button class="btn-reiniciar" id="btnReiniciar">Volver a jugar</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('ruleta');
    const ctx = canvas.getContext('2d');
    const btnGirar = document.getElementById('btnGirar');
    const howieCuerpo = document.getElementById('howieCuerpo');
    const howieAla = document.getElementById('howieAla');
    const modalPremio = document.getElementById('modalPremio');
    const textoPremioGanado = document.getElementById('textoPremioGanado');
    const btnReiniciar = document.getElementById('btnReiniciar');

    function configurarRutaImagen(imgEl, nombreArchivo) {
      const rutas = [nombreArchivo, `img/${nombreArchivo}`, `assets/${nombreArchivo}`, `images/${nombreArchivo}`];
      let intento = 0;
      imgEl.onerror = function() {
        intento++;
        if (intento < rutas.length) {
          imgEl.src = rutas[intento];
        }
      };
    }
    configurarRutaImagen(howieCuerpo, 'hc.png');
    configurarRutaImagen(howieAla, 'ha.png');

    const segmentos = [
      { label: 'Premio dificil', peso: 2,  color1: '#f5df96', color2: '#b8891e', textoColor: '#091326', especial: true },
      { label: 'premio m1',      peso: 12, color1: '#162b4d', color2: '#0d1b33', textoColor: '#f5f0e6', especial: false },
      { label: 'premio m2',      peso: 12, color1: '#1e3a66', color2: '#132645', textoColor: '#f5f0e6', especial: false },
      { label: 'Premio facil',   peso: 26, color1: '#162b4d', color2: '#0d1b33', textoColor: '#f5f0e6', especial: false },
      { label: 'premio m3',      peso: 12, color1: '#1e3a66', color2: '#132645', textoColor: '#f5f0e6', especial: false },
      { label: 'premio m4',      peso: 12, color1: '#162b4d', color2: '#0d1b33', textoColor: '#f5f0e6', especial: false },
      { label: 'premio m5',      peso: 12, color1: '#1e3a66', color2: '#132645', textoColor: '#f5f0e6', especial: false },
      { label: 'premio m6',      peso: 12, color1: '#162b4d', color2: '#0d1b33', textoColor: '#f5f0e6', especial: false }
    ];

    const totalGajos = segmentos.length;
    const arcoGajo = (2 * Math.PI) / totalGajos;
    let anguloActual = 0;
    let girando = false;

    function dibujarRuleta() {
      const centroX = canvas.width / 2;
      const centroY = canvas.height / 2;
      const radio = canvas.width / 2;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < totalGajos; i++) {
        const anguloInicio = anguloActual + i * arcoGajo;
        const anguloFin = anguloInicio + arcoGajo;
        const seg = segmentos[i];

        ctx.beginPath();
        ctx.moveTo(centroX, centroY);
        ctx.arc(centroX, centroY, radio, anguloInicio, anguloFin);
        ctx.closePath();

        const grad = ctx.createRadialGradient(centroX, centroY, 45, centroX, centroY, radio);
        grad.addColorStop(0, seg.color1);
        grad.addColorStop(1, seg.color2);
        ctx.fillStyle = grad;
        ctx.fill();

        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(212, 175, 55, 0.55)';
        ctx.stroke();

        ctx.save();
        ctx.translate(centroX, centroY);
        ctx.rotate(anguloInicio + arcoGajo / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = seg.textoColor;
        ctx.font = seg.especial
          ? '700 22px Montserrat, sans-serif'
          : '500 20px Montserrat, sans-serif';
        ctx.fillText(seg.label, radio - 38, 7);
        ctx.restore();
      }

      for (let i = 0; i < totalGajos; i++) {
        const anguloPin = anguloActual + i * arcoGajo;
        const pinX = centroX + Math.cos(anguloPin) * (radio - 14);
        const pinY = centroY + Math.sin(anguloPin) * (radio - 14);

        ctx.beginPath();
        ctx.arc(pinX, pinY, 5, 0, 2 * Math.PI);
        ctx.fillStyle = '#f6e29c';
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = '#7d5c0c';
        ctx.stroke();
      }
    }

    function elegirIndiceGanador() {
      const sumaPesos = segmentos.reduce((acc, s) => acc + s.peso, 0);
      let random = Math.random() * sumaPesos;
      for (let i = 0; i < segmentos.length; i++) {
        if (random < segmentos[i].peso) return i;
        random -= segmentos[i].peso;
      }
      return 0;
    }

    function girarRuleta() {
      if (girando) return;
      girando = true;
      btnGirar.disabled = true;

      const indiceGanador = elegirIndiceGanador();
      const anguloPunteroArriba = 1.5 * Math.PI;
      const centroGajo = indiceGanador * arcoGajo + arcoGajo / 2;

      let anguloDestino = (anguloPunteroArriba - centroGajo) % (2 * Math.PI);
      if (anguloDestino < 0) anguloDestino += 2 * Math.PI;

      const vueltasExtra = 6 * 2 * Math.PI;
      const actualNormalizado = ((anguloActual % (2 * Math.PI)) + (2 * Math.PI)) % (2 * Math.PI);
      let delta = anguloDestino - actualNormalizado;
      if (delta <= 0) delta += 2 * Math.PI;

      const rotacionTotal = vueltasExtra + delta;
      const anguloInicial = anguloActual;
      const duracion = 4800;
      const inicioTiempo = performance.now();
      let ultimoGajoSonado = -1;

      function animar(ahora) {
        const transcurrido = ahora - inicioTiempo;
        const progreso = Math.min(transcurrido / duracion, 1);
        const ease = 1 - Math.pow(1 - progreso, 4);
        anguloActual = anguloInicial + rotacionTotal * ease;

        dibujarRuleta();

        const indiceBajoPuntero = Math.floor(
          (((anguloPunteroArriba - anguloActual) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI) / arcoGajo
        );
        if (indiceBajoPuntero !== ultimoGajoSonado) {
          ultimoGajoSonado = indiceBajoPuntero;
          howieAla.classList.add('tick');
          setTimeout(() => howieAla.classList.remove('tick'), 75);
        }

        if (progreso < 1) {
          requestAnimationFrame(animar);
        } else {
          anguloActual = anguloInicial + rotacionTotal;
          dibujarRuleta();

          setTimeout(() => {
            textoPremioGanado.textContent = segmentos[indiceGanador].label;
            modalPremio.classList.add('activo');
            girando = false;
          }, 1000);
        }
      }

      requestAnimationFrame(animar);
    }

    function reiniciarRuleta() {
      modalPremio.classList.remove('activo');
      btnGirar.disabled = false;
    }

    btnGirar.addEventListener('click', girarRuleta);
    btnReiniciar.addEventListener('click', reiniciarRuleta);

    dibujarRuleta();
  </script>
</body>
</html>
